name: QSM278 draft Desktop one attempt
on:
  push:
    branches: [qa/qsm278-draft-desktop-once]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify approved draft and build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api repos/kareem-sf/tawreed-source --jq '.visibility' | grep -x public
          mkdir -p "$RUNNER_TEMP/qa/package"
          cd "$RUNNER_TEMP/qa/package"
          gh release download v0.1.1-rc1 --repo kareem-sf/tawreed-source --pattern '*amd64.deb' --pattern SHA256SUMS
          echo '499c0dbff62dcf33b050472cecd94f5c978e51d1c0c63849a15fea019013a0fb  Tawreed_0.1.0_amd64.deb' | sha256sum -c -
          grep 'Tawreed_0.1.0_amd64.deb' SHA256SUMS | sha256sum -c -
          echo 'Release 410815083; asset 634352340; source f933543f48eddceb02c20942a0a01a1b25383e42; build 38277647067'
          dpkg-deb --field *.deb Package Version Architecture
      - name: One clean installed GUI attempt and synthetic import
        run: |
          set -eu
          cd "$RUNNER_TEMP/qa"
          sudo apt-get update -qq
          sudo apt-get install -y ./package/*.deb xvfb xdotool imagemagick tesseract-ocr dbus-x11
          mkdir -p isolated
          export TAWREED_HOME="$RUNNER_TEMP/qa/isolated"
          curl -fsSL https://raw.githubusercontent.com/kareem-sf/tawreed-source/f933543f48eddceb02c20942a0a01a1b25383e42/service/tests/fixtures/boq-english.pdf -o "$RUNNER_TEMP/qa/synthetic.pdf"
          cat > gui.sh <<'SCRIPT'
          set -eu
          cleanup() { pkill -x tawreed || true; pkill -f '^/usr/lib/Tawreed/service/tawreed-service' || true; }
          trap cleanup EXIT
          /usr/bin/tawreed > desktop.log 2>&1 &
          sleep 20
          cat desktop.log
          xdotool search --onlyvisible --name 'Tawreed|توريد' > windows.txt
          cat windows.txt
          import -window root first-run.png
          tesseract first-run.png stdout 2>/dev/null
          echo FIRST_RUN_PNG_BEGIN
          base64 -w 100 first-run.png
          echo FIRST_RUN_PNG_END
          # Open the central BOQ file picker; no AI or approval buttons are selected.
          xdotool mousemove 640 540 click 1
          sleep 3
          xdotool key ctrl+l
          xdotool type --clearmodifiers "$RUNNER_TEMP/qa/synthetic.pdf"
          xdotool key Return
          sleep 15
          import -window root after-import.png
          tesseract after-import.png stdout 2>/dev/null
          echo AFTER_IMPORT_PNG_BEGIN
          base64 -w 100 after-import.png
          echo AFTER_IMPORT_PNG_END
          python3 - <<'CHECK'
          import sqlite3,os,pathlib
          root=pathlib.Path(os.environ['TAWREED_HOME'])
          print('Isolated files:',[str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()])
          for path in root.rglob('*'):
              if path.suffix in ('.db','.sqlite','.sqlite3'):
                  conn=sqlite3.connect(path)
                  print('Tables:',conn.execute("select name from sqlite_master where type='table'").fetchall())
                  for table in ('projects','sources'):
                      try: print(table,conn.execute('select count(*) from '+table).fetchone())
                      except sqlite3.OperationalError:pass
          CHECK
          SCRIPT
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' bash gui.sh
      - name: Cleanup
        if: always()
        run: |
          pkill -x tawreed || true
          sudo apt-get remove -y tawreed || true
          echo 'Live AI, public download, full publish and human Desktop acceptance: NOT TESTED'
          echo 'No cache or artifact upload used. Screenshots are in the run log.'
