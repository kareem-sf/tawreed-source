name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: service/pyproject.toml
      - name: Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: linux-ci-${{ hashFiles('desktop/Cargo.lock') }}
      - run: rustup component add clippy
      - run: python -m venv service/.venv && service/.venv/bin/pip install -e './service[dev]'
      - run: npm ci
      - run: npm run bindings && git diff --exit-code ui/src/api
      - run: npm run verify
      - run: npm run build
      - name: Compile Linux deb (verification only)
        run: npm run package:service && npm run tauri -- build --config desktop/tauri.release.conf.json --config desktop/tauri.linux.conf.json
      # The deb is kept one day, only so the clean-machine smoke job can install it. It is never published.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-deb
          path: desktop/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 1
  linux-smoke:
    name: Linux clean-install smoke test
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-deb
          path: deb
      - name: Install, run and remove
        run: |
          sudo apt-get update
          sudo apt-get install -y ./deb/*.deb
          python3 scripts/linux-smoke.py --deb deb/*.deb --fixture service/tests/fixtures/boq-english.pdf --out evidence
          sudo apt-get remove -y tawreed
          if dpkg -s tawreed 2>/dev/null | grep -q 'ok installed'; then echo 'tawreed is still installed'; exit 1; fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-smoke-evidence
          path: evidence
          retention-days: 3
  desktop-windows:
    name: Windows Clippy
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup component add clippy
      - run: cargo clippy --manifest-path desktop/Cargo.toml -- -D warnings
  release-gate:
    name: Release gate
    if: always()
    needs: [verify, linux-smoke, desktop-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.verify.result }}
          SMOKE_RESULT: ${{ needs.linux-smoke.result }}
          WINDOWS_RESULT: ${{ needs.desktop-windows.result }}
        run: test "$RESULT" = success && test "$SMOKE_RESULT" = success && test "$WINDOWS_RESULT" = success
